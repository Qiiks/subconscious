[package]
name = "mcp-stdio-adapter"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "Resident subc module for configured third-party stdio MCP servers."

[[bin]]
name = "ck-mcp-stdio-adapter"
path = "src/main.rs"

[dependencies]
cortexkit-log = { version = "0.3.1", git = "https://github.com/cortexkit/commons.git", rev = "b13e7fcee60b42accc256e9c05284ad044b9f8f6" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs" }
subc-jsonc = { path = "../subc-jsonc" }
subc-protocol = { path = "../subc-protocol" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
