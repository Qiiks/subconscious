[package]
name = "mcp-stdio-adapter"
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false
description = "Resident subc module for configured third-party stdio MCP servers."

[[bin]]
name = "ck-mcp-stdio-adapter"
path = "src/main.rs"

[dependencies]
cortexkit-log = { version = "0.3.2", git = "https://github.com/cortexkit/commons.git", rev = "4bfcb4924ac9efea5825e74beed2e39807bfdd17" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs" }
subc-jsonc = { path = "../subc-jsonc" }
subc-protocol = { path = "../subc-protocol" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
