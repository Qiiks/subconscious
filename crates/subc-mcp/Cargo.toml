[package]
name = "subc-mcp"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "subc MCP integration skeleton: thin stdio shim and two-faced module (no MCP yet)."

# Package stays `subc-mcp` (path-dep'd, `cargo build -p subc-mcp`); the
# executable is `ck-subc-mcp` for fleet process-name uniformity.
[[bin]]
name = "ck-subc-mcp"
path = "src/main.rs"

[dependencies]
cortexkit-log = { version = "0.3.1", git = "https://github.com/cortexkit/commons.git", rev = "b13e7fcee60b42accc256e9c05284ad044b9f8f6" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-async-rw"] }
subc-control = { path = "../subc-control" }
subc-jsonc = { path = "../subc-jsonc" }
subc-protocol = { path = "../subc-protocol" }
subc-transport = { path = "../subc-transport" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process"] }

[dev-dependencies]
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-async-rw"] }
subc-daemon = { path = "../subc-daemon", version = "0.20.0" }
