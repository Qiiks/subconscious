[package]
name = "ck-bus"
version = "0.1.0"
edition = "2021"
publish = false
description = "Supervised owner of the CortexKit NATS message plane."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[[bin]]
name = "ck-bus"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
cortexkit-bus-trait = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-bus-inmemory = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-bus-naming = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-bus-nats = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-store-types = { version = "0.2.2", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs", version = "0.15.4" }
subc-protocol = { path = "../subc-protocol", version = "0.22.0" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
sha2 = "0.10"
subc-control = { path = "../subc-control", version = "0.16.0" }
subc-daemon = { path = "../subc-daemon", version = "0.20.5", features = ["test-support"] }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.0" }
subc-transport = { path = "../subc-transport", version = "0.7.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
